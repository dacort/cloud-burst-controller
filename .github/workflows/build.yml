name: Build and Push

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Go build cross-compiles natively (see the Dockerfile's builder
      # stage); QEMU stays for any RUN step a final stage might gain.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/dacort/cloud-burst-controller:${{ github.sha }}
            ghcr.io/dacort/cloud-burst-controller:latest
          # Layers (go mod download, unchanged stages) carry over between
          # runs in the Actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
