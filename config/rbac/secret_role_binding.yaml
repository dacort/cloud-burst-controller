# Binds the namespaced manager-role (get on Secrets) in the controller's
# own namespace, where BurstNodePools and their Talos config secrets live.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: cloud-burst-controller
    app.kubernetes.io/managed-by: kustomize
  name: manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-role
subjects:
- kind: ServiceAccount
  name: cloud-burst-controller
  namespace: cloud-burst-system
